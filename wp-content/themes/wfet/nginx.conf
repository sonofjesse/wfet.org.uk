# Nginx Configuration for SOJ Core Theme
# Apply these rules on production hosts (e.g. Kinsta → Sites → Tools → Nginx).
# Local by Flywheel: rules live in ../../../../../conf/nginx/site.conf.hbs

# Enable Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Enable Brotli compression (if available)
brotli on;
brotli_comp_level 6;
brotli_types
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Enhanced caching for static assets
# WordPress wp-content (themes, plugins, uploads) — 1 year
location ~* ^/wp-content/.*\.(css|js|mjs|woff2?|ttf|eot|otf|svg|jpg|jpeg|png|gif|webp|avif|ico|map)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
}

# WordPress core static assets
location ~* ^/wp-includes/.*\.(css|js|woff2?|ttf|svg)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
}

# Images - long-term caching (1 year)
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|bmp|tiff)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
    
    # Enable gzip for SVG files
    location ~* \.svg$ {
        gzip on;
        gzip_types image/svg+xml;
    }
}

# CSS and JavaScript - long-term caching (1 year)
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
    gzip_static on;
}

# Fonts - long-term caching (1 year)
location ~* \.(woff|woff2|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
}

# WordPress uploads directory - specific caching
location ~* ^/wp-content/uploads/.*\.(jpg|jpeg|png|gif|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
    
    # Add ETag for cache validation
    etag on;
    
    # Handle conditional requests
    if_modified_since exact;
    add_header Last-Modified $date_gmt;
}

# HTML files - shorter caching (1 hour)
location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header Vary "Accept-Encoding";
}
